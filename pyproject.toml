[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "enterprise-intelligence-hub"
version = "1.0.0"
description = "AI-powered enterprise intelligence platform using AWS Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Enterprise Intelligence Hub Team"}
]
keywords = ["ai", "aws", "bedrock", "enterprise", "intelligence", "streamlit"]

[project.urls]
Homepage = "https://github.com/enterprise-intelligence-hub"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
